<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今年的生日交給命運安排 ♡</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top,#3a2d1d,#12100d 40%,#050505 100%);
  color:#e7c98a;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:420px;
  background:linear-gradient(145deg,#1b1814,#0d0d0d);
  border:1px solid #8b7245;
  border-radius:28px;
  padding:36px 22px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.small{
  font-size:10px;
  letter-spacing:3px;
  color:#b59a68;
}

.icon{
  font-size:52px;
  margin:28px 0;
}

h1,h2{
  font-weight:500;
}

h1{
  font-size:27px;
  line-height:1.6;
}

h2{
  font-size:22px;
}

p{
  color:#b7a98c;
  line-height:1.9;
  font-size:14px;
}

button{
  width:100%;
  border:none;
  font:inherit;
}

.main-btn{
  margin-top:26px;
  padding:16px;
  border-radius:30px;
  background:linear-gradient(110deg,#9c783e,#e1c77e,#9c783e);
  color:#1c150d;
  font-weight:700;
}

.choice{
  margin:14px 0;
  padding:22px 12px;
  border-radius:16px;
  border:1px solid #7f6841;
  background:#171512;
  color:#e7c98a;
}

.choice strong{
  display:block;
  font-size:19px;
  margin-top:8px;
}

.hidden{
  display:none;
}

.result-box{
  border:1px solid #7f6841;
  border-radius:18px;
  padding:20px;
  margin:24px 0;
}
</style>
</head>

<body>

<div class="card">

<div class="small">EXCLUSIVE BIRTHDAY INVITATION</div>

<!-- 首頁 -->
<section id="home">

  <div class="icon">♛</div>

  <h1>
    今年的生日<br>
    交給命運安排 ♡
  </h1>

  <p>
    一場只屬於你的神祕邀約<br>
    命運，將由你親自選擇。
  </p>

  <button class="main-btn" onclick="show('first')">
    開啟命運邀請函 ✦
  </button>

</section>


<!-- 第一關 -->
<section id="first" class="hidden">

  <div class="icon">✦</div>

  <h2>第一章 · 命運的邀請</h2>

  <p>
    跟隨直覺<br>
    選擇一封屬於你的邀請。
  </p>

  <button class="choice" onclick="chooseFirst('月夜邀約','local')">
    ☾
    <strong>月夜邀約</strong>
  </button>

  <button class="choice" onclick="chooseFirst('星辰之約','far')">
    ✧
    <strong>星辰之約</strong>
  </button>

</section>


<!-- 國內 -->
<section id="local" class="hidden">

  <div class="icon">♕</div>

  <h2>第二章 · 神祕篇章</h2>

  <p>
    命運已悄悄指引方向<br>
    再選擇下一份驚喜。
  </p>

  <button class="choice" onclick="finish('午夜篇章')">
    ✦
    <strong>午夜篇章</strong>
  </button>

  <button class="choice" onclick="finish('金色密令')">
    ♛
    <strong>金色密令</strong>
  </button>

</section>


<!-- 國外 -->
<section id="far" class="hidden">

  <div class="icon">✧</div>

  <h2>第二章 · 遠方密令</h2>

  <p>
    命運已把你帶向更遠的地方<br>
    選擇下一封邀請。
  </p>

  <button class="choice" onclick="finish('銀月之都')">
    ☾
    <strong>銀月之都</strong>
  </button>

  <button class="choice" onclick="finish('深藍篇章')">
    ✦
    <strong>深藍篇章</strong>
  </button>

  <button class="choice" onclick="finish('琥珀夜航')">
    ◇
    <strong>琥珀夜航</strong>
  </button>

</section>


<!-- 結果 -->
<section id="result" class="hidden">

  <div class="icon">♛</div>

  <h2>命運已選定</h2>

  <div class="result-box">

    <p>第一關</p>
    <h2 id="r1"></h2>

    <p>第二關</p>
    <h2 id="r2"></h2>

  </div>

  <p>
    你的選擇，我已收到。<br>
    接下來就交給我吧 ♡
  </p>

  <button class="main-btn" onclick="shareResult()">
    將命運傳給我 ♡
  </button>

</section>

</div>


<script>

let firstChoice = "";
let secondChoice = "";

function show(id){
  document.querySelectorAll("section").forEach(function(sec){
    sec.classList.add("hidden");
  });

  document.getElementById(id).classList.remove("hidden");
}

function chooseFirst(name,target){
  firstChoice = name;
  show(target);
}

function finish(name){
  secondChoice = name;

  document.getElementById("r1").textContent = firstChoice;
  document.getElementById("r2").textContent = secondChoice;

  show("result");
}

function shareResult(){

  const text =
  "♛ 生日命運抽籤 ♛\n"+
  "第一關："+firstChoice+"\n"+
  "第二關："+secondChoice+"\n"+
  "我的生日就交給你了 ♡";

  if(navigator.share){
    navigator.share({text:text});
  }else{
    navigator.clipboard.writeText(text);
    alert("已複製結果，貼到 LINE 傳給我 ♡");
  }
}

</script>

</body>
</html>
